<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Direct Deposit - Demo University Portal</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    // No backend: just show a confirmation and update the masked account.
    function saveDeposit(event) {
      event.preventDefault();
      const account = document.getElementById("account").value.trim();
      if (account.length >= 4) {
        document.getElementById("current").textContent = "****" + account.slice(-4);
      }
      document.getElementById("result").textContent = "Direct deposit updated";
    }
  </script>
</head>
<body>
  <div class="demo-banner">DEMO PORTAL - fake data for a hackathon</div>
  <nav class="nav"><div class="nav-inner">
    <a class="brand" href="index.html">Demo University</a>
    <a href="index.html">Home</a>
    <a href="grades.html">Grades</a>
    <a href="pay.html">Pay</a>
    <a href="jobs.html">Jobs</a>
    <a href="deposit.html" aria-current="page">Direct Deposit</a>
  </div></nav>

  <main>
    <h1>Direct deposit</h1>
    <p class="subtitle">Alex Rivera · Where your campus job pay is sent</p>

    <section class="card">
      <h2>Current account</h2>
      <div class="muted">Demo Credit Union · Checking</div>
      <div class="masked" id="current">****4821</div>
    </section>

    <section class="card">
      <h2>Change account</h2>
      <form onsubmit="saveDeposit(event)">
        <div class="field">
          <label for="routing">Routing number</label>
          <input id="routing" name="routing" inputmode="numeric" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="account">Account number</label>
          <input id="account" name="account" inputmode="numeric" autocomplete="off" required>
        </div>
        <button type="submit">Save direct deposit</button><span class="status" id="result" role="status"></span>
      </form>
    </section>
  </main>

  <footer>Demo University is fictional. All data on this site is fake.</footer>
</body>
</html>
